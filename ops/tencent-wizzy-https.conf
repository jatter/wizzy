# Replace only the gateway's wizzy.conf. Keep the other domains unchanged.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name wizzy.refineview.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/wizzy-acme;
    }
    location / {
        return 301 https://wizzy.refineview.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name wizzy.refineview.com;
    ssl_certificate /etc/letsencrypt/live/wizzy.refineview.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wizzy.refineview.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WizzyTLS:10m;
    client_max_body_size 100m;

    location / {
        proxy_pass http://106.13.191.107:9060;
        proxy_http_version 1.1;
        # The Baidu origin accepts the IP Host; the public RP/origin is configured in the API.
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }
}
