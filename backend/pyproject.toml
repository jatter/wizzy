[project]
name = "wizzy-backend"
version = "0.1.0"
description = "小知模块化单体 API 与任务服务"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "celery[redis]>=5.6,<5.7",
  "pwdlib[argon2]>=0.2,<1",
  "pillow>=11,<13",
  "python-multipart>=0.0.20,<1",
  "cryptography>=46,<48",
  "pyotp>=2.9,<3",
  "numpy>=2,<3",
  "scipy>=1.15,<2",
  "pypdf>=6,<7",
  "pypdfium2>=5,<6",
  "webauthn>=2.7,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.hatch.build.targets.wheel]
packages = ["src/wizzy"]
