plugins { id 'com.android.application' }

def signingFile = rootProject.file('../../.local/android-signing/release.properties')
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }
def siteOrigin = providers.gradleProperty('wizzyOrigin').getOrElse('https://wizzy.refineview.com')
if (!(siteOrigin ==~ /https:\/\/[a-zA-Z0-9.-]+(:[0-9]+)?/)) throw new GradleException('wizzyOrigin must be an HTTPS origin')

android {
    namespace 'com.refineview.wizzy'
    compileSdk 35
    defaultConfig {
        applicationId 'com.refineview.wizzy'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'SITE_ORIGIN', '"' + siteOrigin + '"'
    }
    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file('../../.local/android-signing/' + signing.getProperty('storeFile'))
                storePassword signing.getProperty('storePassword')
                keyAlias signing.getProperty('keyAlias')
                keyPassword signing.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
}
dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
